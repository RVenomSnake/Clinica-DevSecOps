name: DevSecOps
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.97.0   # pin a version you've tested
    steps:
      - uses: actions/checkout@v4
      - name: SAST con Semgrep
        run: semgrep scan --config .semgrep/sql.yml --metrics=off --error

  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci --ignore-scripts
      - name: Generar SBOM con Trivy
        run: >
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.58.0
          fs --format cyclonedx --output /src/sbom.json /src
      - name: Guardar SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
      - name: Gate de dependencias
        run: npm audit --audit-level=high --omit=dev
